<section class="pagina">

    <div class="cabecalho-pagina">

        <div>
            <h1>Empregados</h1>
            <p>Cadastro e gerenciamento de empregados</p>
        </div>

        <button
            type="button"
            id="btnNovo"
            class="btn btn-primary">
            Novo empregado
        </button>

    </div>


    <!-- ================================================================ -->
    <!-- FORMULÁRIO -->
    <!-- ================================================================ -->

    <section class="card">

        <h2 id="tituloFormulario">
            Novo empregado
        </h2>

        <form id="formEmpregado">

            <div class="form-grid">

                <div class="campo">
                    <label for="data">
                        Data
                    </label>

                    <input
                        type="date"
                        id="data"
                        name="data">
                </div>


                <div class="campo">
                    <label for="foto">
                        Foto
                    </label>

                    <input
                        type="text"
                        id="foto"
                        name="foto">
                </div>


                <div class="campo">
                    <label for="empregado">
                        Empregado
                    </label>

                    <input
                        type="text"
                        id="empregado"
                        name="empregado"
                        required>
                </div>


                <div class="campo">
                    <label for="matricula">
                        Matrícula
                    </label>

                    <input
                        type="text"
                        id="matricula"
                        name="matricula">
                </div>


                <div class="campo">
                    <label for="diretoria">
                        Diretoria
                    </label>

                    <input
                        type="text"
                        id="diretoria"
                        name="diretoria">
                </div>


                <div class="campo">
                    <label for="setor">
                        Setor
                    </label>

                    <input
                        type="text"
                        id="setor"
                        name="setor">
                </div>


                <div class="campo">
                    <label for="usuario">
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario">
                </div>


                <div class="campo">
                    <label for="condicao">
                        Condição
                    </label>

                    <select
                        id="condicao"
                        name="condicao">

                        <option value="">
                            Selecione
                        </option>

                        <option value="NORMAL">
                            NORMAL
                        </option>

                        <option value="AFASTADO">
                            AFASTADO
                        </option>

                        <option value="FÉRIAS">
                            FÉRIAS
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="status">
                        Status
                    </label>

                    <select
                        id="status"
                        name="status">

                        <option value="ATIVO">
                            ATIVO
                        </option>

                        <option value="INATIVO">
                            INATIVO
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-acoes">

                <button
                    type="submit"
                    class="btn btn-primary">
                    Salvar
                </button>

                <button
                    type="button"
                    id="btnNovo"
                    class="btn btn-secondary">
                    Limpar
                </button>

            </div>

        </form>

    </section>


    <!-- ================================================================ -->
    <!-- EMPREGADOS CADASTRADOS -->
    <!-- ================================================================ -->

    <section class="card">

        <div class="cabecalho-tabela">

            <div>

                <h2>
                    EMPREGADOS CADASTRADOS
                </h2>

            </div>

        </div>


        <div class="tabela-container">

            <table id="tabelaEmpregados">

                <thead>
                    <tr></tr>
                </thead>

                <tbody></tbody>

            </table>

        </div>

    </section>

</section>
