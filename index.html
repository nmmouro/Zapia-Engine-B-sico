<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Painel Frota
    </title>


    <!-- ================================================================
         CSS
         ================================================================ -->

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <link
        rel="stylesheet"
        href="./css/components.css"
    >

</head>


<body>


    <!-- ================================================================
         HEADER GLOBAL
         ================================================================ -->

    <header class="header">


        <!-- LOGO -->

        <div class="header-logo">

            <img
                src="./assets/img/logo.png"
                alt="Logo Painel Frota"
            >

        </div>


        <!-- TÍTULO -->

        <div class="header-title">

            <h1 id="pageTitle">
                PAINEL FROTA
            </h1>

        </div>


        <!-- RELÓGIO / FULLSCREEN -->

        <div class="header-info">


            <div
                id="clock"
                class="clock"
                aria-label="Relógio"
            >
            </div>


            <button
                id="btnFullscreen"
                class="btn-icon"
                type="button"
                aria-label="Tela cheia"
                title="Tela cheia"
            >
                ⛶
            </button>


        </div>

    </header>


    <!-- ================================================================
         ÁREA PRINCIPAL
         ================================================================ -->

    <main class="home-container">


        <!-- ============================================================
             MENU PRINCIPAL
             ============================================================ -->

        <section
            id="menu"
            class="menu-grid"
            aria-label="Menu principal"
        >


            <!-- ========================================================
                 LANÇAMENTOS
                 ======================================================== -->

            <a
                href="#/lancamentos"
                class="menu-card"
            >

                <span class="menu-icon">
                    📋
                </span>

                <h2>
                    Lançamentos
                </h2>

                <p>
                    Controle de lançamentos
                </p>

            </a>


            <!-- ========================================================
                 VEÍCULOS
                 ======================================================== -->

            <a
                href="#/veiculos"
                class="menu-card"
            >

                <span class="menu-icon">
                    🚙
                </span>

                <h2>
                    Veículos
                </h2>

                <p>
                    Cadastro de veículos
                </p>

            </a>


            <!-- ========================================================
                 EMPREGADOS
                 ======================================================== -->

            <a
                href="#/empregados"
                class="menu-card"
            >

                <span class="menu-icon">
                    👤
                </span>

                <h2>
                    Empregados
                </h2>

                <p>
                    Cadastro de empregados
                </p>

            </a>


        </section>


        <!-- ============================================================
             ENGINE ROUTER
             
             As páginas carregadas pelo Router serão inseridas aqui.
             ============================================================ -->

        <section
            id="app"
            aria-live="polite"
        >
        </section>


    </main>


    <!-- ================================================================
         APP ENGINE
         ================================================================ -->

    <script
        type="module"
        src="./js/app.js"
    >
    </script>


</body>

</html>
