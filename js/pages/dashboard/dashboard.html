<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel Frota</title>

    <link
        rel="stylesheet"
        href="./css/dashboard.css"
    >

</head>

<body>

    <!-- ============================================================
         DASHBOARD
    ============================================================= -->

    <main class="dashboard">


        <!-- ========================================================
             CABEÇALHO
        ========================================================= -->

        <header class="dashboard-header">

            <div class="logo">

                <img
                    src="./assets/logo.png"
                    alt="Logo"
                >

            </div>

            <h1>
                Painel Frota
            </h1>

        </header>


        <!-- ========================================================
             CONTEÚDO
        ========================================================= -->

        <section class="dashboard-content">


            <!-- ====================================================
                 VEÍCULOS / EMPREGADOS
            ===================================================== -->

            <div class="tables-row">


                <!-- ==================================================
                     VEÍCULOS
                =================================================== -->

                <section class="table-panel">

                    <div class="table-panel-header">

                        <h2>
                            Veículos
                        </h2>

                    </div>

                    <div class="table-container">

                        <table id="tabela-veiculos">

                            <thead>

                                <tr>

                                    <th>
                                        Código
                                    </th>

                                    <th>
                                        Placa
                                    </th>

                                    <th>
                                        Veículo
                                    </th>

                                    <th>
                                        Modelo
                                    </th>

                                </tr>

                            </thead>

                            <tbody id="tabela-veiculos-body">

                                <tr>

                                    <td colspan="4">
                                        Nenhum registro encontrado.
                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </section>


                <!-- ==================================================
                     EMPREGADOS
                =================================================== -->

                <section class="table-panel">

                    <div class="table-panel-header">

                        <h2>
                            Empregados
                        </h2>

                    </div>

                    <div class="table-container">

                        <table id="tabela-empregados">

                            <thead>

                                <tr>

                                    <th>
                                        Código
                                    </th>

                                    <th>
                                        Nome
                                    </th>

                                    <th>
                                        Cargo
                                    </th>

                                    <th>
                                        Situação
                                    </th>

                                </tr>

                            </thead>

                            <tbody id="tabela-empregados-body">

                                <tr>

                                    <td colspan="4">
                                        Nenhum registro encontrado.
                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </section>

            </div>


            <!-- ====================================================
                 LANÇAMENTOS
            ===================================================== -->

            <section class="table-panel lancamentos-panel">

                <div class="table-panel-header">

                    <h2>
                        Lançamentos
                    </h2>

                </div>

                <div class="table-container">

                    <table id="tabela-lancamentos">

                        <thead>

                            <tr>

                                <th>
                                    Data
                                </th>

                                <th>
                                    Veículo
                                </th>

                                <th>
                                    Empregado
                                </th>

                                <th>
                                    Tipo
                                </th>

                                <th>
                                    Descrição
                                </th>

                                <th>
                                    Valor
                                </th>

                            </tr>

                        </thead>

                        <tbody id="tabela-lancamentos-body">

                            <tr>

                                <td colspan="6">
                                    Nenhum lançamento encontrado.
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </section>

    </main>


    <!-- ============================================================
         JAVASCRIPT
    ============================================================= -->

    <script
        type="module"
        src="js/pages/dashboard.js"
    ></script>

</body>

</html>
