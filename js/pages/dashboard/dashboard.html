<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Painel Frota - Dashboard

    </title>

    <!-- =============================================================== -->
    <!-- CSS -->
    <!-- =============================================================== -->

    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/tabela.css">
</head>

<body>

    <!-- =============================================================== -->
    <!-- HEADER -->
    <!-- =============================================================== -->

   <header class="topbar">
  <div>
    <div class="brand">ENGINE</div>
    <div class="subtitle">Framework básico • Lancamentos</div>
  </div>
  <div id="clock" class="clock"></div>
</header>
    <!-- =============================================================== -->
    <!-- CONTEÚDO -->
    <!-- =============================================================== -->

    <main class="dashboard">

        <!-- =========================================================== -->
        <!-- LINHA SUPERIOR -->
        <!-- =========================================================== -->

        <section class="dashboard-top">

            <!-- ======================================================= -->
            <!-- VEÍCULOS -->
            <!-- ======================================================= -->

            <table id="tabela-veiculos">

    <thead>
        <tr>
            <th>Código</th>
            <th>Placa</th>
            <th>Veículo</th>
            <th>Modelo</th>
        </tr>
    </thead>

    <tbody id="tabela-veiculos-body">

        <tr>
            <td colspan="4">
                Carregando...
            </td>
        </tr>

    </tbody>

</table>

            <!-- ======================================================= -->
            <!-- EMPREGADOS -->
            <!-- ======================================================= -->

            <table id="tabela-empregados">

    <thead>
        <tr>
            <th>Código</th>
            <th>Nome</th>
            <th>Cargo</th>
            <th>Situação</th>
        </tr>
    </thead>

    <tbody id="tabela-empregados-body">

        <tr>
            <td colspan="4">
                Carregando...
            </td>
        </tr>

    </tbody>

</table>

        <!-- =========================================================== -->
        <!-- PAINEL DE OCORRÊNCIAS -->
        <!-- =========================================================== -->

       <section class="table-panel ocorrencias-panel">

    <div class="table-panel-header">

        <h2>
            Ocorrências em andamento
        </h2>

    </div>

    <div class="table-container">

        <table id="tabela-ocorrencias">

            <thead>

                <tr>

                    <th>
                        Data
                    </th>

                    <th>
                        Veículo
                    </th>

                    <th>
                        Tipo
                    </th>

                    <th>
                        Descrição
                    </th>

                    <th>
                        Status
                    </th>

                </tr>

            </thead>

            <tbody id="tabela-ocorrencias-body">

                <tr>

                    <td colspan="5">
                        Carregando...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</section>

    </main>
    <!-- =============================================================== -->
    <!-- FOOTER -->
    <!-- =============================================================== -->

    <footer class="footer">

        <p>

            Painel Frota © 2026

        </p>

    </footer>

    <!-- =============================================================== -->
    <!-- JAVASCRIPT -->
    <!-- =============================================================== -->

    <script
        type="module"
        src="js/pages/dashboard.js">

    </script>

</body>

</html>
