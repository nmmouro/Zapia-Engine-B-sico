<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Painel Frota - Dashboard

    </title>

    <!-- =============================================================== -->
    <!-- CSS -->
    <!-- =============================================================== -->

    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/tabela.css">
</head>

<body>

    <!-- =============================================================== -->
    <!-- HEADER -->
    <!-- =============================================================== -->

   <header class="topbar">
  <div>
    <div class="brand">ENGINE</div>
    <div class="subtitle">Framework básico • Lancamentos</div>
  </div>
  <div id="clock" class="clock"></div>
</header>
    <!-- =============================================================== -->
    <!-- CONTEÚDO -->
    <!-- =============================================================== -->

    <main class="dashboard">

        <!-- =========================================================== -->
        <!-- LINHA SUPERIOR -->
        <!-- =========================================================== -->

        <section class="dashboard-top">

            <!-- ======================================================= -->
            <!-- VEÍCULOS -->
            <!-- ======================================================= -->

            <article class="card">

                <h2>

                    Veículos

                </h2>

                <div id="tabelaVeiculos">

                </div>

            </article>

            <!-- ======================================================= -->
            <!-- EMPREGADOS -->
            <!-- ======================================================= -->

            <article class="card">

                <h2>

                    Empregados

                </h2>

                <div id="tabelaEmpregados">

                </div>

            </article>

        </section>

        <!-- =========================================================== -->
        <!-- PAINEL DE OCORRÊNCIAS -->
        <!-- =========================================================== -->

       <section class="dashboard-bottom">

        <article class="card">

            <h2>Ocorrências em Andamento</h2>

            <div id="tabelaOcorrencias"></div>

            </article>

        </section>

    </main>
    <!-- =============================================================== -->
    <!-- FOOTER -->
    <!-- =============================================================== -->

    <footer class="footer">

        <p>

            Painel Frota © 2026

        </p>

    </footer>

    <!-- =============================================================== -->
    <!-- JAVASCRIPT -->
    <!-- =============================================================== -->

    <script
        type="module"
        src="js/pages/dashboard.js">

    </script>

</body>

</html>
