<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engine • Lancamentos</title>
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/layout.css">
<link rel="stylesheet" href="./css/tabela.css">
</head>
<body>
<div id="app-loading" class="loading-overlay hidden">
  <div class="spinner"></div><span>Carregando...</span>
</div>

<header class="topbar">
  <div>
    <div class="brand">ENGINE</div>
    <div class="subtitle">Framework básico • Lancamentos</div>
  </div>
  <div id="clock" class="clock"></div>
</header>

<main class="container">
  <section class="page-header">
    <div>
      <h1>Lancamentos</h1>
      <p>Cadastro e gerenciamento da frota.</p>
    </div>
    <button id="btnNovo" class="btn btn-primary" type="button">+ Novo lancamento</button>
  </section>

  <section class="card">
    <div class="card-header">
      <div>
        <h2>Lancamentos cadastrados</h2>
        <span id="contador" class="muted">0 registros</span>
      </div>
      <button id="btnAtualizar" class="btn btn-secondary" type="button">Atualizar</button>
    </div>

    <div class="table-wrapper">
      <table id="tabelaLancamentos"><thead></thead><tbody></tbody></table>
    </div>
    <div id="vazio" class="empty hidden">Nenhum lançamento cadastrado.</div>
  </section>
</main>

<div id="modal" class="modal hidden" aria-hidden="true">
  <div class="modal-backdrop" data-close-modal></div>
  <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="tituloModal">
    <div class="modal-header">
      <div>
        <h2 id="tituloModal">Novo lancamento</h2>
        <p>Preencha os dados do lancamento.</p>
      </div>
      <button id="btnFecharModal" class="icon-button" type="button" aria-label="Fechar">×</button>
    </div>

    <form id="formLancamento" autocomplete="off">
      <input id="id" type="hidden">

      <div class="form-grid">
        <label><span>Data</span><input id="data" name="Data" type="date"></label>
        <label><span>Hora</span><input id="hora" name="Hora" type="time"></label>
        <label><span>Empregado *</span><input id="empregado" name="Empregado / Matrícula" maxlength="25" required></label>
        <label><span>Veículo *</span><input id="veiculo" name="Veículo" required></label>
        <label><span>Passageiro</span><input id="passageiro" name="Passageiro / Setor / Motivo"></label>
        
        <label><span>Itinerário</span><input id="itineraro" name="Itinerário"></label>
        
        <label><span>Status</span><input id="status" name="Status"></label>
       
      </div>

      <div id="formErro" class="form-error hidden"></div>

      <div class="modal-footer">
        <button id="btnCancelar" class="btn btn-secondary" type="button">Cancelar</button>
        <button class="btn btn-primary" type="submit">Salvar</button>
      </div>
    </form>
  </section>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
